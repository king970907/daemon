<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAEMON / FOURTH ACCORD — Coming Soon</title>
    <meta name="description" content="代蒙管制終端 — 系統校準中，即將開放。" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens mirror Spirit_Realm src/constants/theme.ts + docs/UI_STYLE.md */
      :root {
        --bg: #0a0a0a;
        --surface: #171717;
        --surface-alt: #262626;
        --graphite: #363636;
        --border: #707070;
        --text: #e5e5e5;
        --text-dim: #a3a3a3;
        --text-faint: #737373;
        --accent: #d98c2b;
        --accent-bright: #f0a63f;
        --on-accent: #412402;
        --danger: #f03e24;
        --radius: 4px;
        --skew: -15deg;
        --en: "Barlow Condensed", "Arial Narrow", sans-serif;
        --zh: "Noto Sans TC", "PingFang TC", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--zh);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Background: graphite grid + scanlines + vignette */
      .backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(54, 54, 54, 0.35) 1px, transparent 1px) 0 0 /
            48px 48px,
          linear-gradient(90deg, rgba(54, 54, 54, 0.35) 1px, transparent 1px) 0
            0 / 48px 48px,
          radial-gradient(
            ellipse at 50% 40%,
            rgba(217, 140, 43, 0.08),
            transparent 60%
          );
      }
      .backdrop::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.22) 0,
          rgba(0, 0, 0, 0.22) 1px,
          transparent 1px,
          transparent 3px
        );
        box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.9);
      }

      .shell {
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 20px 16px;
        max-width: 1120px;
        margin: 0 auto;
      }

      /* ---- Header bar ---- */
      .sysbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-family: var(--en);
        font-size: 13px;
        letter-spacing: 0.18em;
        color: var(--text-faint);
        border-bottom: 1px solid var(--graphite);
        padding-bottom: 12px;
      }
      .sysbar .secure {
        color: var(--accent);
      }
      .sysbar .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        background: var(--accent);
        border-radius: 1px;
        animation: blink 1.2s steps(2, start) infinite;
      }

      /* ---- Hazard stripe ---- */
      .hazard {
        height: 10px;
        margin: 28px 0 0;
        border-radius: var(--radius);
        background: repeating-linear-gradient(
          -45deg,
          var(--accent) 0 14px,
          var(--surface) 14px 28px
        );
        opacity: 0.9;
      }

      /* ---- Main ---- */
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 40px;
        align-items: center;
        padding: 56px 0;
      }

      .eyebrow {
        font-family: var(--en);
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.32em;
        color: var(--accent);
        margin-bottom: 16px;
      }

      h1 {
        font-family: var(--en);
        font-weight: 700;
        font-size: clamp(56px, 11vw, 132px);
        line-height: 0.86;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      h1 .hl {
        color: var(--accent);
      }
      h1 .cursor {
        display: inline-block;
        width: 0.42em;
        height: 0.1em;
        margin-left: 0.08em;
        background: var(--accent);
        animation: blink 1s steps(2, start) infinite;
      }

      .zh-title {
        margin-top: 22px;
        font-weight: 700;
        font-size: clamp(20px, 3vw, 28px);
        letter-spacing: 0.12em;
      }
      .lede {
        margin-top: 12px;
        max-width: 34em;
        color: var(--text-dim);
        line-height: 1.8;
        font-size: 15px;
      }

      /* Skewed button: skew on the fill, never on the label (theme.ts SHAPE) */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 32px;
      }
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 30px;
        border-radius: var(--radius);
        overflow: hidden;
        font-family: var(--en);
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.2em;
        text-decoration: none;
        color: var(--on-accent);
        isolation: isolate;
        cursor: default;
      }
      .btn::before {
        content: "";
        position: absolute;
        inset: 0 -14px;
        z-index: -1;
        transform: skewX(var(--skew));
        background: var(--accent);
      }
      .btn.ghost {
        color: var(--text);
      }
      .btn.ghost::before {
        background: transparent;
        border: 1px solid var(--border);
        inset: 0 -1px;
      }

      /* ---- Status panel ---- */
      .panel {
        position: relative;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }
      .panel-head {
        position: relative;
        display: flex;
        justify-content: space-between;
        padding: 10px 16px;
        font-family: var(--en);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.22em;
        color: var(--on-accent);
        isolation: isolate;
      }
      .panel-head::before {
        content: "";
        position: absolute;
        inset: 0 -12px;
        z-index: -1;
        background: var(--accent);
        transform: skewX(var(--skew));
      }

      .log {
        list-style: none;
        padding: 16px;
        min-height: 210px;
        font-family: var(--en);
        font-size: 15px;
        letter-spacing: 0.06em;
        line-height: 1.75;
        color: var(--text-dim);
      }
      .log li {
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .log li.on {
        opacity: 1;
        transform: none;
      }
      .log .ok {
        color: var(--accent);
      }
      .log .warn {
        color: var(--danger);
      }
      .log .zh {
        font-family: var(--zh);
        font-size: 13px;
      }

      .meter {
        padding: 0 16px 18px;
      }
      .meter-label {
        display: flex;
        justify-content: space-between;
        font-family: var(--en);
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--text-faint);
        margin-bottom: 8px;
      }
      .meter-label b {
        color: var(--accent);
        font-weight: 700;
      }
      .segments {
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        gap: 3px;
      }
      .segments i {
        height: 14px;
        background: var(--graphite);
        transform: skewX(var(--skew));
        transition: background 0.2s;
      }
      .segments i.on {
        background: var(--accent);
      }

      /* ---- Footer ---- */
      footer {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        border-top: 1px solid var(--graphite);
        padding-top: 14px;
        font-family: var(--en);
        font-size: 12px;
        letter-spacing: 0.2em;
        color: var(--text-faint);
      }
      footer .warn {
        color: var(--danger);
      }

      @keyframes blink {
        to {
          visibility: hidden;
        }
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          gap: 36px;
          padding: 40px 0;
        }
        .sysbar .hide-sm {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .log li {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <div class="shell">
      <header class="sysbar">
        <span><span class="dot"></span>GOV-T / IDENTITY NODE</span>
        <span class="hide-sm">TERMINAL 04 · REGION TW</span>
        <span class="secure">◆ SECURE</span>
      </header>

      <div class="hazard" aria-hidden="true"></div>

      <main>
        <section>
          <p class="eyebrow">DAEMON / FOURTH ACCORD</p>
          <h1>
            Coming<br /><span class="hl">Soon</span
            ><span class="cursor" aria-hidden="true"></span>
          </h1>
          <p class="zh-title">代蒙管制終端　即將開放</p>
          <p class="lede">
            終端機正在進行最後校準， 操作員授權開放前，請保持待命。
          </p>
          <div class="actions">
            <span class="btn">STANDBY ▸</span>
            <span class="btn ghost">iOS / ANDROID</span>
          </div>
        </section>

        <aside class="panel" aria-label="系統狀態">
          <div class="panel-head">
            <span>SYSTEM BOOT</span>
            <span id="clock">--:--:--</span>
          </div>
          <ul class="log" id="log"></ul>
          <div class="meter">
            <div class="meter-label">
              <span>CALIBRATION</span>
              <b id="pct">0%</b>
            </div>
            <div class="segments" id="segments"></div>
          </div>
        </aside>
      </main>

      <footer>
        <span>© DAEMON / FOURTH ACCORD</span>
        <span class="warn">⚠ UNAUTHORIZED ACCESS WILL BE LOGGED</span>
      </footer>
    </div>

    <script>
      const LINES = [
        ["> INIT TERMINAL ............", "OK", "ok"],
        ["> LINK GPS ARRAY ...........", "OK", "ok"],
        ["> SYNC TEMPLE REGISTRY .....", "OK", "ok"],
        ["> DAEMON CONTAINMENT .......", "ARMED", "ok"],
        ["> OPERATOR AUTHORIZATION ...", "PENDING", "warn"],
        ["系統校準中，請保持待命。", "", "zh"],
      ];

      const log = document.getElementById("log");
      LINES.forEach(([text, status, cls], i) => {
        const li = document.createElement("li");
        if (cls === "zh") {
          li.className = "zh";
          li.textContent = text;
        } else {
          li.textContent = text + " ";
          const s = document.createElement("span");
          s.className = cls;
          s.textContent = status;
          li.appendChild(s);
        }
        log.appendChild(li);
        setTimeout(() => li.classList.add("on"), 300 + i * 450);
      });

      // Calibration meter: fills to 85% and holds — "almost, not yet".
      const SEGMENTS = 20;
      const TARGET = 17;
      const seg = document.getElementById("segments");
      const pct = document.getElementById("pct");
      const cells = Array.from({ length: SEGMENTS }, () => {
        const el = document.createElement("i");
        seg.appendChild(el);
        return el;
      });
      let lit = 0;
      const fill = setInterval(() => {
        if (lit >= TARGET) return clearInterval(fill);
        cells[lit++].classList.add("on");
        pct.textContent = Math.round((lit / SEGMENTS) * 100) + "%";
      }, 140);

      const clock = document.getElementById("clock");
      const tick = () => {
        clock.textContent = new Date().toLocaleTimeString("en-GB", {
          hour12: false,
        });
      };
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
